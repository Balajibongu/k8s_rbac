apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::832510228841:role/eksctl-roboshop-dev-nodegroup-robo-NodeInstanceRole-c6RIKQn8V1kT
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}

  mapUsers: |
    - groups:
      - pod-reader
      userarn: arn:aws:iam::832510228841:user/raghu
      username: raghu

    - groups:
      - pod-reader
      userarn: arn:aws:iam::832510228841:user/somu
      username: somu

    - groups:
      - pod-reader
      userarn: arn:aws:iam::832510228841:user/suresh
      username: suresh
  